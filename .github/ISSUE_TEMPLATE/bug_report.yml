name: Bug Report
description: File a bug report to help improve Shrey
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with Shrey! Please review [docs/KNOWN_ISSUES.md](https://github.com/NoWayShub/Shrey/blob/main/docs/KNOWN_ISSUES.md) before submitting.
  - type: input
    id: device
    attributes:
      label: Device & Android Version
      description: e.g. Samsung Galaxy S23, Android 14 (OneUI 6.0)
      placeholder: Device model and OS version
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Shrey Version
      description: e.g. 0.0.1-beta
      placeholder: v0.0.1-beta
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open Shrey
        2. Paste URL '...'
        3. Tap Analyze
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Diagnostics
      description: Paste any error messages from the Settings > Diagnostics screen or logcat. (Do not paste sensitive credentials or private tokens).
      render: shell
