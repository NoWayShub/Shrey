name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Git tag (e.g. v0.0.1-beta)'
        required: true
        default: 'v0.0.1-beta'

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore (if secret is configured)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/.android
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > $HOME/.android/shrey-release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/../.android/shrey-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "$KEYSTORE_PATH" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            echo "Keystore secret not present; skipping automated remote release build."
          fi
